language: en-US
reviews:
  # Only publish review feedback; do not modify code or approve pull requests.
  high_level_summary_in_walkthrough: true
  auto_apply_labels: false
  auto_assign_reviewers: false
  auto_approvals:
    enabled: false
  post_merge_actions: []
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    base_branches:
      - '^dev$'
      - '^main$'
  path_instructions:
    - path: 'src/**'
      instructions: |
        BrimDeck uses .NET 10, C#, and WPF, targeting Windows 11.
        Provide concise, formal English feedback. Focus on code-backed functional bugs, regressions, resource leaks, and security issues, explaining trigger conditions and impact rather than stylistic preferences.
        Check UI thread access, async cancellation, event subscriptions, resource disposal, and idle CPU, memory, and animation overhead for overlay windows.
        Production builds must resolve the real AppData/Local/BrimDeck/settings.json for the current user without hardcoding usernames or using packaged LocalCache copies. Automated tests use isolated temp directories.
    - path: 'tests/**'
      instructions: |
        检查测试是否覆盖改动的实际行为、边界和错误路径。测试必须使用独立临时数据目录，不得修改用户正式设置或结束其他会话的进程。
